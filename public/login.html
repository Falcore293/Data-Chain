<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Log in to Data Chain — a secure file transfer system with blockchain-verified integrity and end-to-end encryption.">
<title>Data Chain · Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-effects">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
    <div class="scan-line"></div>
  </div>
  <div class="auth-card">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Data Chain</h1>
    </div>
    <p class="subtitle">Log in to your account</p>

    <div class="msg" id="msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Log In</button>
    </form>

    <form id="twoFaForm" style="display:none;">
      <p class="hint" style="margin-top:0;">This account has 2-step verification enabled. Answer your security questions.</p>
      <div id="securityQuestionsFields"></div>
      <button type="submit" class="btn-primary" id="twoFaSubmitBtn">Verify & Log In</button>
    </form>

    <div class="switch-link">Don't have an account? <a href="signup.html">Sign up</a></div>
    <div class="switch-link" style="margin-top:8px;"><a href="forgot-password.html">Forgot your password?</a></div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
